<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mostly Legal Driving Simulator</title>
    <style>
      :root {
        --accent: #f5c518;
        --panel: rgba(20, 20, 24, 0.92);
        --text: #f2f2f2;
        --muted: #9a9aa3;
        --danger: #ff6b6b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: var(--text);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      #game,
      #tags {
        position: fixed;
        inset: 0;
      }
      #tags {
        pointer-events: none;
        overflow: hidden;
      }
      .name-tag {
        position: absolute;
        left: 0;
        top: 0;
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 12px;
        white-space: nowrap;
        will-change: transform;
      }
      #arrows {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .player-arrow {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .player-arrow .icon {
        position: absolute;
        overflow: visible;
      }
      .player-arrow .label {
        position: absolute;
        top: 22px;
        transform: translateX(-50%);
        padding: 0 5px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.5);
        font-size: 11px;
        white-space: nowrap;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        font-size: 13px;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        white-space: pre;
      }

      /* Top-right column: match status, with the kill feed below it however tall the status is. */
      #corner {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: none;
      }
      #match-status {
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.5);
        font-size: 13px;
        line-height: 1.5;
        text-align: right;
        white-space: pre;
        pointer-events: none;
      }
      #match-status[hidden] {
        display: none;
      }
      #killfeed {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        pointer-events: none;
      }
      #killfeed .kill {
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 13px;
        white-space: nowrap;
        animation: kill-fade 6s forwards;
      }
      #killfeed .kill.mine {
        outline: 1px solid var(--accent);
      }
      #killfeed .name.me {
        color: var(--accent);
      }
      #killfeed .cause {
        color: var(--muted);
      }
      @keyframes kill-fade {
        0%,
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #scoreboard {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: min(360px, calc(100vw - 32px));
        max-width: calc(100vw - 32px);
        padding: 20px 24px;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #scoreboard[hidden] {
        display: none;
      }
      #scoreboard h2 {
        margin: 0 0 12px;
        color: var(--accent);
        text-align: center;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      #scoreboard th {
        color: var(--muted);
        font-weight: normal;
        text-align: left;
        border-bottom: 1px solid #44444c;
      }
      #scoreboard td,
      #scoreboard th {
        padding: 4px 8px;
      }
      #scoreboard td:nth-child(n + 3),
      #scoreboard th:nth-child(n + 3) {
        text-align: right;
      }
      #scoreboard tr.me td {
        color: var(--accent);
      }
      #scoreboard p {
        margin: 12px 0 0;
        text-align: center;
        color: var(--muted);
      }
      #scoreboard p:empty {
        display: none;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 15%;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: var(--accent);
        font-size: 15px;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #toast.visible {
        opacity: 1;
      }

      #wasted {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        pointer-events: none;
        background: radial-gradient(circle, rgba(80, 0, 0, 0.15), rgba(40, 0, 0, 0.45));
      }
      #wasted[hidden] {
        display: none;
      }
      #wasted .title {
        font-size: clamp(48px, 12vw, 96px);
        font-weight: bold;
        letter-spacing: 4px;
        color: #d11a1a;
        text-shadow: 0 3px 0 #000, 0 0 24px rgba(0, 0, 0, 0.8);
      }
      #wasted .detail {
        margin-top: 8px;
        font-size: 16px;
        color: #fff;
        text-shadow: 0 1px 3px #000;
      }

      #join {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: radial-gradient(circle at 50% 40%, #2a2a31, #0c0c0e);
      }
      #join[hidden] {
        display: none;
      }
      #join-form {
        width: min(340px, 100%);
        padding: 28px 24px;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #join h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
      }
      #join .subtitle {
        margin: -6px 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      #join label {
        font-size: 12px;
        color: var(--muted);
      }
      #join input {
        font: inherit;
        font-size: 16px;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid #44444c;
        background: #111114;
        color: var(--text);
      }
      #join input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #join button {
        font: inherit;
        font-size: 15px;
        padding: 10px 12px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
      }
      #join-play {
        margin-top: 6px;
        background: var(--accent);
        color: #111;
        font-weight: bold;
      }
      #join-play:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #join-offline {
        background: transparent;
        color: var(--muted);
        text-decoration: underline;
      }
      #join-error {
        margin: 0;
        min-height: 1em;
        color: var(--danger);
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="tags"></div>
    <div id="arrows"></div>
    <div id="hud"></div>
    <div id="corner">
      <div id="match-status" hidden></div>
      <div id="killfeed"></div>
    </div>
    <div id="scoreboard" hidden></div>
    <div id="toast" role="status"></div>
    <div id="wasted" hidden>
      <div class="title">WASTED</div>
      <div class="detail" id="wasted-cause"></div>
      <div class="detail" id="wasted-countdown"></div>
    </div>
    <div id="join" hidden>
      <form id="join-form">
        <h1>Mostly Legal<br />Driving Simulator</h1>
        <p class="subtitle">prototype</p>
        <label for="join-name">Your name</label>
        <input id="join-name" name="name" autocomplete="nickname" placeholder="Leave empty for a random one" />
        <button id="join-play" type="submit">Play online</button>
        <button id="join-offline" type="button">Play offline</button>
        <p id="join-error" role="alert"></p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
